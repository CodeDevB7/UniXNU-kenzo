schema_version = 2

[board]
example = false
name = "kenzo"
soc = "MSM8956"
soc_source = "msm8956"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi Note 3 (Kenzo) Snapdragon 650"
kit = "kenzo"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "RamBlock", "GopFramebuffer", "AppleKeyStoreState"]

[kernel]
defconfig = "kenzo_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/msm8956.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "component:RamBlock",
  "build-sdhci-block.py",
  "build-kenzo-pmgr.py",
  "component:AppleKeyStoreState",
  "build-kenzo-display.py",
]

[device_tree]
source = "device:dts/kenzo.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "kenzo"
dsc = "Platforms/Xiaomi/kenzoPkg/kenzo.dsc"
fd = "Build/kenzoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "kenzo"

[bootimg.image]
base = 0x80000000
kernel_offset = 0x8000
ramdisk_offset = 0x20000000
tags_offset = 0x100
pagesize = 2048
header_version = 0

# Resources/DTBs/kenzo.dtb already contains /memory/splash_region@83000000 (0x83000000, 40 MiB);
# omitting [[bootimg.dtb_node]] avoids fdtput -c failing with FDT_ERR_EXISTS.

[payload]
volume = "KENZO"
size_mib = 192
loader = "firmware"
title = "UniXNU"
dram_size = "0x80000000"
kernel_args = ["-v", "serial=3", "debug=0x144", "keepsyms=1", "smp=1", "armcpu-self-ipi=1", "sheng-pmgr=2", "no-lc=1", "panic_on_crash_disabled=1", "wdt=-1", "offline-legacy-gop=1", "offline-legacy-register=1", "offline-legacy-unit-scale=2", "offline-legacy-pm=1", "offline-legacy-phase=4", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-retire=1", "offline-legacy-cpu-present=1", "offline-key-events=1", "aks=1", "aks-sls=3", "vsync=60"]

[payload.adt]
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
packed_data_ramdisk = true
owned_memory_size = "0x20000000"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "kenzo_defconfig"
