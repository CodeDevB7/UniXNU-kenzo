schema_version = 2

[board]
example = false
name = "kenzo"
soc = "MSM8956"
soc_source = "msm8956"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Redmi Note 3 (Kenzo) Snapdragon 650"
kit = "kenzo"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "RamBlock", "GopFramebuffer", "AppleKeyStoreState"]

[kernel]
defconfig = "kenzo_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/msm8956.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "component:RamBlock",
  "build-sdhci-block.py",
  "build-kenzo-pmgr.py",
  "component:AppleKeyStoreState",
  "build-kenzo-display.py",
]

[device_tree]
source = "device:dts/kenzo.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "kenzo"
dsc = "Platforms/Xiaomi/kenzoPkg/kenzo.dsc"
fd = "Build/kenzoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = ["{uefi}", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}"]

[firmware.defines]
DEVICE_MODEL = "kenzo"

[bootimg.image]
base = 0x80000000
kernel_offset = 0x8000
ramdisk_offset = 0x20000000
tags_offset = 0x100
pagesize = 2048
header_version = 0

# Resources/DTBs/kenzo.dtb already contains /memory/splash_region@83000000 (0x83000000, 40 MiB);
# omitting [[bootimg.dtb_node]] avoids fdtput -c failing with FDT_ERR_EXISTS.

[payload]
volume = "KENZO"
size_mib = 192
loader = "firmware"
title = "UniXNU"
dram_size = "0x80000000"
# 4 OS profile fixups + 5 no-Metal/datamigrator fixups proven on iPadOS 17.7.11 (21H461):
# #5 prevents CoreImage OpenGL NULL jump in iconservicesagent (+[CUIShapeEffectStack sharedCIContext]);
# #6-#9 prevent com.apple.datamigrator / SystemAppMigrator stalls.
text_fixups = [
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
  "dyld_shared_cache_arm64.11,34f3b84,979701944914d794,e0031faa4914d794",
  "com.apple.datamigrator,52b8,7f021aeb41f9ff54e2430591,5f1300f141f9ff5407000014",
  "com.apple.datamigrator,c218,fd7bbfa9fd030091,000080d2c0035fd6",
  "com.apple.datamigrator,c270,fd7bbfa9fd030091,000080d2c0035fd6",
  "SystemAppMigrator,a64c,350a0094e0031caa3b0a0094,1f2003d5e0031caa1f2003d5",
]
kernel_args = ["-v", "serial=3", "debug=0x144", "keepsyms=1", "smp=1", "armcpu-self-ipi=1", "sheng-pmgr=2", "no-lc=1", "panic_on_crash_disabled=1", "wdt=-1", "validation_disables=0x10", "memorystatus_log_level=3", "sheng-disable-watchdogd=1", "sheng-lite=1", "sirius-skip-setup=0", "offline-legacy-gop=1", "offline-legacy-register=1", "offline-legacy-unit-scale=2", "offline-legacy-pm=1", "offline-legacy-phase=4", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-retire=1", "offline-legacy-cpu-present=1", "sirius-fb-wc=1", "sirius-fb-cached=1", "offline-key-events=1", "aks=1", "aks-sls=3", "vsync=60", "sheng-vsync=60"]

[adt.product.string]
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.defaults.u32]
sleep-disabled = 1
"kern.maxvnodes" = 16384

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[payload.adt]
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
packed_data_ramdisk = true
owned_memory_size = "0x20000000"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "kenzo_defconfig"
