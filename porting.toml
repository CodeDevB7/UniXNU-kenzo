[[area]]
id = "display"
status = "implemented"
components = []
paths = ["package/*Display*", "package/*Framebuffer*", "package/*Backlight*", "package/AppleARMBacklight.cpp", "package/GeniI2c*", "scripts/*display*", "scripts/*gop*", "scripts/*framebuffer*"]
inputs = ["BOE NT35532 1080p video mode DSI panel (1080x1920) with continuous splash region at 0x83000000 (40 MiB); mainline Kenzo DTS and lk2nd mdp5.c show LittleKernel initializes the active scanout buffer (e.g. 0x83200000) in 24-bit packed RGB888.", "DarwinBootPkg/Driver/BootVideo.h strictly requires 32-bit PixelBlueGreenRedReserved8BitPerColor (BGRX8888)."]
configuration = ["CodeDevB7/uefi-kenzo includes Platforms/Xiaomi/kenzoPkg/Drivers/KenzoSimpleFbDxe/KenzoSimpleFbDxe.inf in kenzo.dsc and kenzo.fdf."]
procedure = ["Build SILICIUM_UEFI.fd via uefi-kenzo CI and test temporary fastboot boot on physical Kenzo to verify GOP rendering on the BOE NT35532 panel."]
findings = ["Implemented KenzoSimpleFbDxe: checks MDP_GDSCR (0x0184D078 BIT31), probes VIG_0/RGB_0/DMA_0 SSPP pipes for active PIPE_SSPP_SRC0_ADDR, reconfigures SSPP to 32-bit BGRX8888 (format 0x000236FF, unpack 0x03020001, stride Width*4), flushes via MDP_CTL_0_FLUSH (0x01A02018), and installs GOP + DevicePath (fallback 0x83200000 1080x1920). Compiled cleanly into SILICIUM_UEFI.fd in run 45101031181."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["Compiled into SILICIUM_UEFI.fd; physical panel output has not yet been tested on device."]
next_action = ["Test kenzo-uefi-only-boot.img via fastboot boot on physical Kenzo to verify MDP5 BGRX8888 scanout and UniXNU menu visibility."]
evidence = [{ kind = "source", reference = "evidence/2026-11-13-memory-map-analysis.md", result = "Identified 1080x1920 BOE NT35532 panel and verified cont_splash framebuffer region at 0x83000000 (40 MiB)." }, { kind = "source", reference = "evidence/2026-11-24-uefi-firmware-build.md", result = "KenzoSimpleFbDxe implemented with MDP5 24->32bpp BGRX8888 conversion and compiled into SILICIUM_UEFI.fd (run 45101031181)." }]

