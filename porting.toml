schema_version = 1

[device]
name = "kenzo"
soc = "MSM8956"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi Note 3 (kenzo) Snapdragon 650 porting record."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "evidence/**", "scripts/prepare-kernel-patches.py", "unixnu.lock", ".gitmodules", ".github/**", ".gitignore"]
inputs = ["Xiaomi Redmi Note 3, codename kenzo; Qualcomm MSM8956; selected profile ipados-17.7.11-21H461.", "Shared SoC feed points to CodeDevB7/UniXNU-msm8956-common at d6845aea8fc3e5c14993b269fcca92927e85fb45, corrected from the connected device's active FDT."]
configuration = ["board.toml selects ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink and DarwinBoot; kenzo_defconfig; SoC and OS config fragments; ordered arch, SoC, OS and device patch series.", "[package] unixnu is ../UniXNU and [package.defconfig] maps ipados-17.7.11-21H461 to kenzo_defconfig.", "[bootimg.image] defines base=0x80000000, pagesize=2048, offsets; duplicate [[bootimg.dtb_node]] for splash_region was removed because Resources/DTBs/kenzo.dtb already contains /memory/splash_region@83000000."]
procedure = ["Resolve board configuration from the UniXNU checkout with unixnu status -D UniXNU-kenzo.", "Run scripts/package.sh --check --os ipados-17.7.11-21H461 from the device repository after required local sources are available.", "Use .github/workflows/dts-adt.yml to compile the board DTS and generate the ADT on a macOS runner; use kernel.yml for the kernel build."]
findings = ["The current repository uses format 2 and the shared SoC feed; the older handoff's build workflow description predates the current package interface.", "The package script previously stopped immediately because [package].unixnu was absent; after recording the path and profile-to-defconfig mapping, host preflight resolved kenzo_defconfig and all 59 patches.", "The extracted 86-DTB QCDT set contains reference roots only, but a live device-tree capture now identifies the bootloader-populated MSM8956 MTP tree and matching reference selector DTB 0.", "The kernel-only macOS workflow checks out UniXNU at c34f018aafd6befd5dc93c05a8dccd5bdce6724b and uploads the kernel binary and redacted text logs. Its pre-build helper removes only the optional Sheng PMGR probe hunk from the generic boot-progress patch; it fails closed if the upstream hunk layout changes.", "Run 43170315275 completed successfully on macOS. The final build and prelink produced kernel.macho with SHA-256 43bad77f58e9a3582f330ebb3c70ad4b48d0c350188d17c2bd38ed8454b7650f. The bootstrap pass first reported unresolved mockfs symbols before the configured archive build; the later main kernel link succeeded. The first successful run retained redacted logs but did not yet publish the kernel as an artifact.", "Updated board.toml with verified bootimg parameters (base 0x80000000, pagesize 2048, offsets) and removed the duplicate splash_region dtb_node after fdtput -c returned FDT_ERR_EXISTS on stock kenzo.dtb; UEFI firmware build and unixnu bootimg round-trip verify() passed in CI run 45101031181."]
completion = ["The pinned SoC source resolves; package preflight writes the selected configuration and patch resolution completes for the selected OS profile."]
limits = ["Package preflight, patch resolution, standalone DTS-to-ADT generation, kernel compilation/prelink, UEFI FD build, and UEFI-only boot.img packaging are host/CI-verified. Full payload assembly and physical device boot remain unverified."]
next_action = ["Test kenzo-uefi-only-boot.img via temporary fastboot boot on physical Kenzo and verify max-download-size / high-RAM ramdisk_offset before packing the 192 MiB payload."]
evidence = [{ kind = "source", reference = "board.toml", result = "Format 2 board selection and package path/defconfig mapping." }, { kind = "source", reference = "feeds.toml", result = "Pinned MSM8956 shared SoC feed at d6845aea8fc3e5c14993b269fcca92927e85fb45." }, { kind = "source", reference = "evidence/2026-11-12-dtb-inventory.md", result = "Local extracted roots identify Qualcomm reference platforms only; the live device FDT selector matches extracted DTB 0." }, { kind = "source", reference = "evidence/2026-11-12-local-kernel-attempt.md", result = "Local XNU patching needed a Sheng-only hunk workaround; builds on /mnt/c failed during atomic header replacement, and the ext4 retry was interrupted before completion." }, { kind = "source", reference = "scripts/prepare-kernel-patches.py", result = "Pre-build helper removes only the optional Sheng PMGR progress hunk and fails if its recognized layout changes." }, { kind = "source", reference = ".github/workflows/dts-adt.yml", result = "Compiles Kenzo DTS and generates the OS-specific ADT on macOS Actions using the pinned SoC feed." }, { kind = "source", reference = "https://github.com/UniXNU/UniXNU/blob/c34f018aafd6befd5dc93c05a8dccd5bdce6724b/.github/workflows/macos.yml", result = "Reusable macOS workflow provides a kernel-only build with redacted text logs and no image artifacts." }, { kind = "host", reference = "evidence/2026-11-12-package-check.md", command = "bash scripts/package.sh --check --os ipados-17.7.11-21H461", revision = "b9280aaa8c6f7fd2622bdc0b28aea8b9c35438a7", result = "Historical pass on WSL/Linux against SoC pin 894aea231e7ac7133b2947777b2dbc89bdd4c6aa (not the corrected current pin): wrote config for kenzo_defconfig, extracted profile IPSW inputs, resolved 59 patches. UniXNU source revision 5a00e20157f3975d155f13ced7593347f9f5bf73." }, { kind = "host", reference = "evidence/2026-11-12-adt-preflight.md", command = "dtc -I dts -O dtb -i <msm8956 DTSI> -o /tmp/kenzo-hardware.dtb dts/kenzo.dts; python3 scripts/make-adt.py --dtb /tmp/kenzo-hardware.dtb --os-profile profiles/os/ipados-17.7.11-21H461/profile.toml --board ../UniXNU-kenzo/board.toml --output /tmp/kenzo.adt", revision = "b9280aaa8c6f7fd2622bdc0b28aea8b9c35438a7", result = "DTS compiled and generated a 12,888-byte ADT on WSL/Linux against the earlier SoC revision 894aea231e7ac7133b2947777b2dbc89bdd4c6aa; this does not validate the corrected current pin or verify UEFI/device boot. SoC revision 894aea231e7ac7133b2947777b2dbc89bdd4c6aa; UniXNU revision 5a00e20157f3975d155f13ced7593347f9f5bf73." }, { kind = "host", reference = "evidence/2026-11-13-bootimg-package-check.md", command = "bash scripts/package.sh --check --os ipados-17.7.11-21H461", revision = "dbdc31a1fcbf10ebb7db504806a4cedd9a6a12e3", result = "Package check passed with bootimg image parameters and splash DTB node: 59 patches, configuration kenzo_defconfig, OS profile 21H461." }, { kind = "host", reference = "evidence/2026-11-24-uefi-firmware-build.md", command = "./unixnu build firmware -D ../device --uefi ../uefi-kenzo --target DEBUG; ./unixnu bootimg -D ../device --uefi ../uefi-kenzo --dtb ../uefi-kenzo/Resources/DTBs/kenzo.dtb --ramdisk none --target DEBUG -o ../kenzo-uefi-only-boot.img", revision = "6be596960f543c903290a487a95b49c531123de7", result = "CI run 45101031181 passed: SILICIUM_UEFI.fd (3,145,728 bytes, SHA-256 b8e8431502c4d5a6bd03bbfec352052ec3ad223f03a03023baad1308c0c2f414) and kenzo-uefi-only-boot.img (507,904 bytes, SHA-256 7b3e28d032c51335766d214c6d7221233f26a2333695cfc3b72cf050f1fb91e3) verified." }]

[[area]]
id = "firmware"
status = "host-verified"
components = []
paths = ["proprietary-files.txt", "scripts/extract-files.py", "scripts/gen-touch-firmware.py"]
inputs = ["Kenzo stock Android boot image and extracted device-tree data are present in the sibling kenzo-dump directory.", "CodeDevB7/uefi-kenzo (commit 61f5b82d8e634c635687d0800ec0f1e99e1adcbb) implements Platforms/Xiaomi/kenzoPkg directly on microsoft/mu_basecore (release/202608) with PeilessSec, KenzoPlatformLib, KenzoSimpleFbDxe, KenzoPlatformBootManagerLib, BootShim.S, Resources/Configs/kenzo.toml, and verified kenzo.dtb."]
configuration = ["board.toml configures [firmware] with dsc = 'Platforms/Xiaomi/kenzoPkg/kenzo.dsc', fd = 'Build/kenzoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd', base = 0x9FC00000, size = 0x300000.", "kenzo.dsc configures GICv2 (0x0B000000/0x0B002000), verified Kenzo Arch Timer PPIs (17, 18, 19, 20) with ArmGenericTimerVirtCounterLib, PSCI reset, emulated RAM variables, UniXNUPkg, DarwinBootPkg, DiskIoDxe, and FatPkg."]
procedure = ["Build firmware and UEFI-only boot image via GitHub Actions (.github/workflows/firmware.yml in CodeDevB7/uefi-kenzo) using unixnu build firmware and unixnu bootimg."]
findings = ["Pure mu_basecore PeilessSec firmware built cleanly on GitHub Actions run 45101031181: SILICIUM_UEFI.fd is exactly 3,145,728 bytes (0x300000) and kenzo-uefi-only-boot.img (507,904 bytes) passed BootShim ARM64 header validation and bootimg.py round-trip verify().", "KenzoPlatformLib preserves incoming x0 FDT in mEntryArgHobGuid for UniXNURamDiskDxe and keeps Modem/Reloc/TZ carveouts unmapped in MMU.", "Open constraint: ramdisk_offset = 0x01000000 leaves only 32 MiB before splash_region@83000000; full 192 MiB payload will require verifying fastboot max-download-size and relocating ramdisk_offset into high RAM."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["Host/CI build and boot.img round-trip verification passed; physical fastboot boot execution on Kenzo hardware has not been run yet."]
next_action = ["Boot kenzo-uefi-only-boot.img temporarily via fastboot boot on physical Kenzo (never fastboot flash) to verify display output and UniXNU menu entry."]
evidence = [{ kind = "source", reference = "https://github.com/CodeDevB7/uefi-kenzo/commit/61f5b82d8e634c635687d0800ec0f1e99e1adcbb", result = "Complete mu_basecore PeilessSec kenzoPkg implementation, KenzoSimpleFbDxe, BootShim.S header fix, and CI workflow." }, { kind = "host", reference = "evidence/2026-11-24-uefi-firmware-build.md", command = "./unixnu build firmware -D ../device --uefi ../uefi-kenzo --target DEBUG; ./unixnu bootimg -D ../device --uefi ../uefi-kenzo --dtb ../uefi-kenzo/Resources/DTBs/kenzo.dtb --ramdisk none --target DEBUG -o ../kenzo-uefi-only-boot.img", revision = "6be596960f543c903290a487a95b49c531123de7", result = "GitHub Actions run 45101031181 succeeded: SILICIUM_UEFI.fd (3,145,728 bytes, SHA-256 b8e8431502c4d5a6bd03bbfec352052ec3ad223f03a03023baad1308c0c2f414) and kenzo-uefi-only-boot.img (507,904 bytes, SHA-256 7b3e28d032c51335766d214c6d7221233f26a2333695cfc3b72cf050f1fb91e3)." }, { kind = "source", reference = "evidence/2026-11-12-uefi-research.md", result = "No public Kenzo/MSM8956 EDK2/Mu-Silicium board config was found; near-match SDM660 configs and the lk2nd/MSM8956 references do not provide a verified UEFI path." }, { kind = "device", reference = "evidence/2026-11-12-aboot-readonly.md", command = "adb exec-out su -c 'dd if=/dev/block/mmcblk0p19 bs=1M status=none'", revision = "0ea480d8cd8f025754767d74cae3a83e84acf960", result = "Read-only aboot hash recorded. Its binary has a fastboot-boot-unavailable string, but the user reports repeatedly booting boot.img and recovery.img successfully; no such command was run during this task." }, { kind = "device", reference = "evidence/2026-11-12-aboot-readonly.md", command = "User report: repeated successful fastboot boot boot.img and fastboot boot recovery.img; exact image hashes/output not captured", revision = "01be3c57b1e45149acf85aac68860f62dbf22af0", result = "User confirms fastboot boot works for Android boot and recovery images on this device; this is not yet a UEFI payload test." }, { kind = "device", reference = "evidence/2026-11-12-boot-chain-readonly.md", command = "adb exec-out su -c 'dd if=/dev/block/mmcblk0p4 bs=1M status=none'; adb exec-out su -c 'dd if=/dev/block/mmcblk0p8 bs=1M status=none'; adb exec-out su -c 'dd if=/dev/block/mmcblk0p10 bs=1M status=none'", revision = "0ea480d8cd8f025754767d74cae3a83e84acf960", result = "Recorded SBL1, TZ and HYP partition hashes; TZ exposes version TZ.BF.3.0.3-00047. No partition was written." }]

[[area]]
id = "cpu"
status = "implemented"
paths = ["dts/**", "package/CpuFreq*", "scripts/*armcpu*"]
components = ["ArmCpu"]
inputs = ["The connected Kenzo reports six online Linux CPUs and soc_id 266 (MSM8956). Its active FDT identifies MSM8956 MTP, qcom,msm-id <0x10a 0>, qcom,board-id <8 0>; these selectors match extracted DTB 0. A draft postmarketOS Kenzo DTS requests revision 1.1 instead and does not match the live tree.", "The captured active FDT reports CPU MPIDRs 0-3, 0x100 and 0x103 as CPUs; 0x101 and 0x102 are NAK placeholders."]
configuration = ["The shared SoC DTSI sets /cpus/timebase-frequency to 19200000, observed CPU affinity values 0-3 and 0x100/0x103, PSCI method smc, GICv2 ranges 0x0b000000/0x1000 and 0x0b002000/0x1000, and exports the controller as intc. The debug UART uses captured range 0x078b0000/0x200 and interrupt <0 0x6c 0>.", "The board configuration selects ArmCpu; the SoC fragment enables the GIC and architectural timer."]
procedure = ["Compile dts/kenzo.dts with the pinned SoC include using dtc -I dts -O dtb.", "Generate the selected OS/device ADT with scripts/make-adt.py and inspect the output against required XNU nodes.", "After the UEFI path exists, boot XNU and capture per-core entry, timer and IPI logs against the captured Android FDT CPU/GIC data."]
findings = ["The active device FDT confirms MSM8956 MTP selector cells, six CPU MPIDRs (0-3, 0x100, 0x103), PSCI SMC, the configured GIC ranges, timer tuples and debug UART range/interrupt. The shared SoC DTSI was corrected for MPIDR 0x103 and the UART resources. No XNU secondary-core or IPI bring-up has been measured."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["The capture is the running Android kernel FDT; CPU entry, XNU timer/IPI behavior, and whether a future UEFI payload receives the same nodes are unverified."]
next_action = ["Build and inspect the ADT with the corrected pinned SoC tree, then validate XNU CPU entry, timer and IPI after a UEFI boot path exists."]
evidence = [{ kind = "source", reference = "https://github.com/CodeDevB7/UniXNU-msm8956-common/commit/d6845aea8fc3e5c14993b269fcca92927e85fb45", result = "SoC DTSI provides the timebase, interrupt-parent and exported GIC node required by the ADT generator." }, { kind = "source", reference = "evidence/2026-11-12-dtb-inventory.md", result = "The live device selector matches reference DTB 0; its source memory values are zeroed and bootloader-populated at runtime." }, { kind = "source", reference = "evidence/2026-11-12-kenzo-mainline-dts.md", result = "The draft Linux DTS requests MSM8956 v1.1, which differs from the live device tree revision." }, { kind = "source", reference = "evidence/2026-11-12-adt-preflight.md", result = "The board DTS compiled and standalone ADT generation completed on the host; physical XNU CPU/GIC behavior remains unverified." }, { kind = "device", reference = "evidence/2026-11-12-live-device-tree.md", command = "adb exec-out su -c 'toybox tar -C /proc/device-tree -cf - .' (SELinux temporarily Permissive with user authorization, restored to Enforcing)", revision = "1ebf05c7198156efb47a25aa8b6879b9e338b374", result = "Captured the running Kenzo Android FDT; root selectors match DTB 0, and CPU/GIC/PSCI/UART values ground the SoC DTS correction. This does not verify XNU boot." }]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "package/*Smmu*", "package/*Memory*", "scripts/*smmu*", "scripts/*memory*"]
inputs = ["The live active FDT reports /memory/reg <0 0x80000000 0 0x80000000>, matching the current DTS 2 GiB window; Linux reports CPUs 0-5 online.", "Analysis of kenzo-dump/iomem.txt and extracted_dtb_0.dtb identifies exact physical firmware carveout nodes and sizes."]
configuration = ["Record the board.toml fields, DTS properties and defconfig values used for memory and dma."]
procedure = ["Follow the memory and dma stage in the porting guide and record the actual commands."]
findings = ["The active Android FDT confirms the 2 GiB DRAM range at 0x80000000. All memory gaps in iomem.txt are reconciled to device-tree nodes: other_ext_region (5M at 0x86300000), modem_region (86M at 0x86c00000), reloc_region (23M at 0x8c200000), and tzapp_region (25M at 0x8dd00000). Upper System RAM from 0x8f600000 to 0xffffffff (1802 MiB) is continuous and free.", "Recommended placement for UEFI FD (FD_BASE) is in upper RAM (e.g. 0x90000000 or 0x9fc00000), safely above all carveouts."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["Complete DRAM banks, firmware carveouts, DMA addressability, cache policy and SMMU ownership remain unverified on UEFI."]
next_action = ["Verify UEFI FD base placement and reconcile future UEFI memory map against the identified carveouts."]
evidence = [{ kind = "source", reference = "evidence/2026-11-12-dtb-inventory.md", result = "The live device selector matches generic DTB 0; the source memory reg is zeroed and bootloader-populated at runtime." }, { kind = "device", reference = "evidence/2026-11-12-live-device-tree.md", command = "adb exec-out su -c 'toybox tar -C /proc/device-tree -cf - .' (SELinux temporarily Permissive with user authorization, restored to Enforcing)", revision = "1ebf05c7198156efb47a25aa8b6879b9e338b374", result = "Live /memory confirms the 2 GiB physical window. No reserved-memory node is exposed; UEFI carveouts remain unknown." }, { kind = "source", reference = "evidence/2026-11-13-memory-map-analysis.md", result = "Reconciled iomem.txt and extracted_dtb_0.dtb carveouts: modem (86M), reloc (23M), tzapp (25M), other (5M), and free upper bank 0x8f600000-0xffffffff (1802 MiB)." }]

