name: macOS kernel build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    uses: UniXNU/UniXNU/.github/workflows/macos.yml@c34f018aafd6befd5dc93c05a8dccd5bdce6724b
    with:
      device_repository: CodeDevB7/UniXNU-kenzo
      device_ref: main
      defconfig: kenzo_defconfig
      steps: kernel
      xcode: "26.6"
      pre_build: python3 "$DEVICE_DIR/scripts/prepare-kernel-patches.py" "$GITHUB_WORKSPACE"
